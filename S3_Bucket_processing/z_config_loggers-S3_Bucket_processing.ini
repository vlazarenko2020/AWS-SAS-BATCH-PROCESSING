[loggers]
keys=root,Modules.f_arguments,Modules.f_file_i_am_working,Modules.f_select_oldest_flag_file,Modules.f_check_sasfile_i_logdir_presence,Modules.ClassSASProgram,Modules.f_run_different_logic_after_run_any_sas,Modules.f_run_different_logic_before_run_any_sas,Modules.f_backup_one_prd_file,Modules.f_ftp_scoring_status_file_to_mainframe,Modules.f_ftp_one_file,Modules.ClassS3FlagFile

[handlers]
keys=consoleHandler,fileHandler

[formatters]
keys=fileFormatter,consoleFormatter,fileFormatter_history

[logger_root]
level=DEBUG
handlers=consoleHandler,fileHandler

[logger_Modules.f_arguments]
level=DEBUG
handlers=consoleHandler,fileHandler
qualname=Modules.f_arguments
propagate=0

[logger_Modules.f_file_i_am_working]
level=DEBUG
handlers=consoleHandler,fileHandler
qualname=Modules.f_file_i_am_working
propagate=0

[logger_Modules.f_select_oldest_flag_file]
level=DEBUG
handlers=consoleHandler,fileHandler
qualname=Modules.f_select_oldest_flag_file
propagate=0

[logger_Modules.f_check_sasfile_i_logdir_presence]
level=DEBUG
handlers=consoleHandler,fileHandler
qualname=Modules.f_check_sasfile_i_logdir_presence
propagate=0

[logger_Modules.ClassSASProgram]
level=DEBUG
handlers=consoleHandler,fileHandler
qualname=Modules.ClassSASProgram
propagate=0

[logger_Modules.f_run_different_logic_after_run_any_sas]
level=DEBUG
handlers=consoleHandler,fileHandler
qualname=Modules.f_run_different_logic_after_run_any_sas
propagate=0

[logger_Modules.f_run_different_logic_before_run_any_sas]
level=DEBUG
handlers=consoleHandler,fileHandler
qualname=Modules.f_run_different_logic_before_run_any_sas
propagate=0

[logger_Modules.f_ftp_scoring_status_file_to_mainframe]
level=DEBUG
handlers=consoleHandler,fileHandler
qualname=Modules.f_ftp_scoring_status_file_to_mainframe
propagate=0

[logger_Modules.f_ftp_one_file]
level=DEBUG
handlers=consoleHandler,fileHandler
qualname=Modules.f_ftp_one_file
propagate=0

[logger_Modules.f_backup_one_prd_file]
level=DEBUG
handlers=consoleHandler,fileHandler
qualname=Modules.f_backup_one_prd_file
propagate=0

[logger_Modules.ClassS3FlagFile]
level=DEBUG
handlers=consoleHandler,fileHandler
qualname=Modules.ClassS3FlagFile
propagate=0

[handler_consoleHandler]
class=StreamHandler
level=DEBUG
formatter=consoleFormatter
args=(sys.stdout,)

[handler_fileHandler]
class=handlers.TimedRotatingFileHandler
level=DEBUG
formatter=fileFormatter
args=('log-S3_Bucket_processing/logger.log','midnight',1,5)

[formatter_fileFormatter]
format=%(asctime)s - %(name)s - %(levelname)s - %(message)s
datefmt=

[formatter_fileFormatter_history]
format=%(asctime)s - %(message)s
datefmt=

[formatter_consoleFormatter]
format=%(name)s - %(message)s
datefmt=


